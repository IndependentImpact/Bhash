# NGINX server block for hashgraphontology.xyz
# -----------------------------------------------
# Serves ontology artefacts with content negotiation:
# clients that send an Accept header for Turtle, JSON-LD, or RDF/XML receive
# the matching serialisation; all other requests receive the HTML catalogue.
#
# Deploy:
#   sudo cp hashgraphontology.xyz.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/hashgraphontology.xyz.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# See docs/nginx-content-negotiation.md for full setup instructions.

# ---------------------------------------------------------------------------
# Map the Accept request header to a file extension for content negotiation.
# The first matching rule wins (NGINX evaluates from top to bottom).
# ---------------------------------------------------------------------------
map $http_accept $negotiated_ext {
    default                     ".html";
    "~*text/turtle"             ".ttl";
    "~*application/ld\+json"    ".jsonld";
    "~*application/rdf\+xml"    ".owl";
    "~*application/owl\+xml"    ".owl";
}

server {
    listen 80;
    listen [::]:80;
    server_name hashgraphontology.xyz www.hashgraphontology.xyz;

    root /var/www/hashgraphontology.xyz;
    charset utf-8;

    # Redirect www → apex.
    if ($host = www.hashgraphontology.xyz) {
        return 301 https://hashgraphontology.xyz$request_uri;
    }

    # ------------------------------------------------------------------
    # MIME types for RDF serialisations (extend the global types block).
    # ------------------------------------------------------------------
    types {
        text/html                   html htm;
        text/turtle                 ttl;
        application/ld+json         jsonld;
        application/rdf+xml         owl rdf;
        application/xml             xml;
    }

    # ------------------------------------------------------------------
    # Landing page
    # ------------------------------------------------------------------
    location = / {
        try_files /index.html =404;
    }

    # ------------------------------------------------------------------
    # Content-negotiated ontology resources
    #
    # Requests to a bare module name (e.g. /core, /token) are served in
    # the format indicated by the Accept header.  The Vary: Accept header
    # tells caches to store separate responses per format.
    # ------------------------------------------------------------------
    location ~ ^/(core|consensus|token|smart-contracts|file-schedule|mirror-analytics|hiero)$ {
        add_header Vary Accept always;
        try_files $uri$negotiated_ext $uri.html =404;
    }

    location ~ ^/alignment/(aiao|claimont|infocomm|impactont|prefixes)$ {
        add_header Vary Accept always;
        try_files $uri$negotiated_ext $uri.html =404;
    }

    location ~ ^/imports/(dcat|provo)$ {
        add_header Vary Accept always;
        try_files $uri$negotiated_ext $uri.html =404;
    }

    # ------------------------------------------------------------------
    # All other files (with explicit extensions) are served directly.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # ------------------------------------------------------------------
    # Security / cache headers
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Cache static RDF artefacts aggressively; HTML is revalidated daily.
    location ~* \.(ttl|owl|jsonld)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ~* \.html$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # ------------------------------------------------------------------
    # Optional: redirect HTTP → HTTPS (uncomment after obtaining TLS cert)
    # ------------------------------------------------------------------
    # return 301 https://$host$request_uri;
}

